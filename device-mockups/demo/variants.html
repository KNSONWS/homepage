<style>
:root { color-scheme: light; }
html, body { margin: 0; }
body { background: #f2f2f4; color: #1d1d1f; font: 14px/1.4 Inter, system-ui, sans-serif; overflow-x: hidden; }
.wrap { box-sizing: border-box; max-width: 1240px; margin: 0 auto; padding: 40px 32px 56px; }
h1 { margin: 0 0 28px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.row { display: grid; gap: 40px 48px; align-items: end; }
.row--mac { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 56px; }
.row--phone { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row--phone .dm-iphone { width: min(100%, 230px); margin: 0 auto; }
figure { margin: 0; }
.cap { margin: 22px 0 0; text-align: center; color: #6e6e73; }
.cap b { color: #1d1d1f; font-weight: 600; }
@media (max-width: 760px) {
  .row--mac { grid-template-columns: minmax(0, 1fr); }
  .row--phone { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* heller Beispielinhalt, 402 x 874 */
.lv { width: 402px; height: 874px; box-sizing: border-box; padding: 62px 22px 34px; color: #2a1a0e;
      font: 15px/1.45 Inter, system-ui, sans-serif;
      background: radial-gradient(90% 40% at 80% 18%, #ffe3a3 0%, rgba(255,227,163,0) 70%), linear-gradient(180deg, #fff8ea, #fdf0d8); }
.lv * { box-sizing: border-box; }
.lv__bar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.lv__logo { display: flex; align-items: center; gap: 8px; font: 800 19px/1 Fraunces, Georgia, serif; color: #8a3f0c; }
.lv__logo i { width: 18px; height: 18px; border-radius: 50%; background: #f5b52e; box-shadow: 0 0 0 4px rgba(245,181,46,.25); }
.lv__menu { display: grid; gap: 5px; }
.lv__menu i { display: block; width: 22px; height: 2px; border-radius: 2px; background: #2a1a0e; }
.lv__hero { padding: 34px 0 26px; }
.lv__chip { display: inline-block; padding: 5px 10px; border-radius: 99px; background: #fff; font-size: 12px; font-weight: 600; color: #3f6b2a; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.lv__title { margin: 16px 0 12px; font: 800 40px/1.02 Fraunces, Georgia, serif; letter-spacing: -.01em; }
.lv__title em { display: block; font-style: normal; color: #e09a12; }
.lv__text { margin: 0 0 22px; color: #5b4636; }
.lv__btn { display: inline-block; padding: 13px 20px; border-radius: 99px; background: #f5b52e; font-weight: 700; font-size: 14px; box-shadow: 0 6px 16px -6px rgba(200,130,10,.6); }
.lv__card { display: flex; justify-content: space-between; padding: 16px 18px; margin-top: 10px; border-radius: 16px; background: rgba(255,255,255,.85); box-shadow: 0 1px 2px rgba(60,30,0,.08); font-size: 14px; }
.lv__card span { color: #7a6656; }

</style>
